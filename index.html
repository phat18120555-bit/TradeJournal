<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>สมุดซื้อขาย</title>
<meta name="description" content="สมุดบันทึกซื้อขายหุ้นและแลกเงิน บาท ↔ USD คำนวณต้นทุนเฉลี่ยและกำไรขาดทุนอัตโนมัติ">
<meta name="theme-color" content="#0A5C74" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1116" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="สมุดซื้อขาย">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF0F2; --surface: #FFFFFF; --surface2: #F5F7F8; --line: #D8DFE4; --line2: #E8ECEF;
  --ink: #0F1B25; --ink2: #4F5E6A; --ink3: #7A8894;
  --accent: #0A5C74; --accent-ink: #FFFFFF; --accent-soft: #DCEDF2;
  --gain: #0A7A4A; --loss: #BD3628; --warn: #9A5B00;
  --gain-soft: #DDF1E6; --loss-soft: #FBE3DF; --warn-soft: #FAEED6;
  --buy: #0A5C74; --buy-soft: #DCEDF2; --sell: #664A99; --sell-soft: #EBE4F6;
  --overlay: rgba(10, 18, 24, .5);
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Prompt", "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1116; --surface: #141C23; --surface2: #1A242C; --line: #26323B; --line2: #1F2A32;
    --ink: #E7EEF3; --ink2: #9AA9B4; --ink3: #74838F;
    --accent: #58BBD6; --accent-ink: #062530; --accent-soft: #123340;
    --gain: #43CF8F; --loss: #FF8272; --warn: #E8A94F;
    --gain-soft: #123A2A; --loss-soft: #43201C; --warn-soft: #3A2C12;
    --buy: #58BBD6; --buy-soft: #123340; --sell: #BBA3F2; --sell-soft: #2C2345;
    --overlay: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1116; --surface: #141C23; --surface2: #1A242C; --line: #26323B; --line2: #1F2A32;
  --ink: #E7EEF3; --ink2: #9AA9B4; --ink3: #74838F;
  --accent: #58BBD6; --accent-ink: #062530; --accent-soft: #123340;
  --gain: #43CF8F; --loss: #FF8272; --warn: #E8A94F;
  --gain-soft: #123A2A; --loss-soft: #43201C; --warn-soft: #3A2C12;
  --buy: #58BBD6; --buy-soft: #123340; --sell: #BBA3F2; --sell-soft: #2C2345;
  --overlay: rgba(0, 0, 0, .62);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
/* ---------- ป้องกันการเลือก/คัดลอกข้อความแบบเว็บไซต์ (ให้รู้สึกเป็นแอป ไม่ใช่หน้าเว็บ) — ยกเว้น input/textarea ที่ต้องกรอกข้อมูล ---------- */
body {
  -webkit-user-select: none; -moz-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
input, textarea, select { -webkit-user-select: text; -moz-user-select: text; user-select: text; -webkit-touch-callout: default; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; letter-spacing: 0; }
.muted { color: var(--ink2); }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.offlinebar { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 12.5px; padding: 7px 12px; padding-top: calc(7px + env(safe-area-inset-top, 0px)); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line2);
}
.topbar-in { max-width: 680px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.topbar h1 { font-size: 19px; flex: 1; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink2); border-radius: 999px; padding: 3px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap;
}
button.pill { min-height: 28px; }
.pill.ok { color: var(--gain); border-color: color-mix(in srgb, var(--gain) 35%, var(--line)); }
.pill.bad { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 40%, var(--line)); background: var(--loss-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }

[hidden] { display: none !important; }
main { max-width: 680px; margin: 0 auto; padding: 14px 16px calc(150px + env(safe-area-inset-bottom, 0px)); }
.stack > * + * { margin-top: 14px; }

/* ---------- panels & rows ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(15, 27, 37, .04); transition: background-color .15s, border-color .15s; }
.panel-pad { padding: 14px 16px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 6px; }
.sec-head h2 { font-size: 15px; }
.sec-head small { color: var(--ink2); font-size: 12px; }
.notice { margin: 10px 0 0; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--loss-soft); color: var(--loss); }
.notice.info { background: var(--accent-soft); color: var(--accent); }

/* ---------- hero + ledger ---------- */
.hero { position: relative; background: linear-gradient(165deg, color-mix(in srgb, var(--accent) 7%, var(--surface)) 0%, var(--surface) 55%); border: 1px solid var(--line); border-radius: 16px; padding: 20px 16px 16px; box-shadow: 0 2px 14px rgba(15, 27, 37, .07); overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, var(--gain))); }
.hero-label { color: var(--ink2); font-size: 13px; }
.hero-num { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.15; margin-top: 2px; letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
.hero-sub { margin-top: 4px; font-size: 14px; color: var(--ink2); }
.ledger { margin-top: 16px; padding-top: 6px; border-top: 1px solid var(--line); }
.ledger-cap { display: flex; justify-content: space-between; color: var(--ink3); font-size: 12px; padding: 4px 0 2px; }
.lrow { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-size: 14.5px; }
.lrow .dots { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-4px); min-width: 12px; }
.lrow b { font-weight: 500; }
.lrow.total { margin-top: 6px; padding: 8px 0 7px; border-top: 1px solid var(--ink2); border-bottom: 4px double var(--ink2); font-weight: 600; font-size: 16px; }
.lrow.total b { font-weight: 600; }
.lrow.sub { color: var(--ink2); font-size: 13px; }
.ledger-foot { color: var(--ink2); font-size: 13px; margin-top: 8px; }

/* ---------- holdings ---------- */
.hold { padding: 12px 16px; border-top: 1px solid var(--line2); }
.hold:first-of-type { border-top: 0; }
.hold-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tk { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.hold-top .grow { flex: 1; color: var(--ink2); font-size: 13px; min-width: 0; }
.hold-top .mv { font-weight: 600; }
.hold-mid { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.pricein { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); }
.pricein input { width: 96px; padding: 7px 10px; text-align: right; border-radius: 9px; }
.hold-bot { margin-top: 6px; font-size: 13px; color: var(--ink2); }
.hold.sold .tk { color: var(--ink2); }
.hold-total { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--ink2); background: var(--surface2); font-weight: 600; font-size: 14.5px; }
.hold-alert { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.hold-alert label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink2); }
.hold-alert input { width: 78px; padding: 6px 8px; text-align: right; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); }
.greet { font-family: var(--font-display); font-weight: 600; font-size: 16px; padding: 2px 2px 0; overflow-wrap: anywhere; word-break: break-word; }
.live-panel { padding-top: 10px; padding-bottom: 10px; }
.live-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.live-row + .live-row { margin-top: 8px; }
.btn.ghost { background: transparent; border-color: var(--line); min-height: 30px; }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 999px; margin-left: auto; }

dl.kv { margin: 0; padding: 4px 16px 10px; }
dl.kv .r { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line2); font-size: 14px; }
dl.kv .r:first-child { border-top: 0; }
dl.kv dt { color: var(--ink2); }
dl.kv dd { margin: 0; text-align: right; }

/* ---------- checks ---------- */
details.panel > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 15px; min-height: 48px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(45deg); margin-left: 4px; transition: transform .15s; }
details.panel[open] > summary::after { transform: rotate(-135deg); }
details.panel > summary .sum-l { flex: 1; display: flex; align-items: center; gap: 8px; }
.check { display: flex; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line2); align-items: flex-start; }
.check .badge { flex: none; margin-top: 2px; }
.check .t { font-size: 14px; }
.check .d { font-size: 12.5px; color: var(--ink2); }
.badge { display: inline-block; min-width: 62px; text-align: center; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; font-weight: 500; }
.badge.OK { background: var(--gain-soft); color: var(--gain); }
.badge.CHECK { background: var(--loss-soft); color: var(--loss); }
.badge.INFO, .badge.NOINPUT { background: var(--surface2); color: var(--ink2); border: 1px solid var(--line); }

/* ---------- transaction rows ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; min-height: 36px; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.month { padding: 12px 16px 6px; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink2); background: var(--surface2); border-top: 1px solid var(--line2); }
.month:first-child { border-top: 0; }
.trow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line2); padding: 11px 16px; min-height: 60px; transition: background-color .1s; }
.month + .trow { border-top: 0; }
.trow:active { background: var(--surface2); }
.tdate { flex: none; width: 34px; text-align: center; line-height: 1.15; }
.tdate b { display: block; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.tdate span { font-size: 11.5px; color: var(--ink2); }
.tmain { flex: 1; min-width: 0; }
.tline1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tline1 b { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; }
.tline2 { font-size: 13px; color: var(--ink2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
.tamt { flex: none; text-align: right; line-height: 1.3; }
.tamt b { display: block; font-weight: 500; font-size: 15px; }
.tamt span { display: block; font-size: 12.5px; color: var(--ink2); }
.tag { font-size: 11.5px; font-weight: 500; border-radius: 6px; padding: 0 7px; line-height: 1.6; }
.tag.buy { background: var(--buy-soft); color: var(--buy); }
.tag.sell { background: var(--sell-soft); color: var(--sell); }
.tag.bad { background: var(--loss-soft); color: var(--loss); }
.empty { padding: 34px 16px; text-align: center; color: var(--ink2); }
.empty b { display: block; color: var(--ink); font-family: var(--font-display); font-size: 15px; margin-bottom: 5px; }

/* ---------- FX dashboard ---------- */
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line2); }
.grid4 > div { background: var(--surface); padding: 12px 16px; }
.grid4 .k { font-size: 12.5px; color: var(--ink2); }
.grid4 .v { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.3; }
.grid4 .s { font-size: 12.5px; }
.rate-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line2); flex-wrap: wrap; }
.rate-row label { font-size: 14px; color: var(--ink2); }
.rate-row input { width: 120px; text-align: right; }
table.mt { width: 100%; border-collapse: collapse; font-size: 13px; }
.tscroll { overflow-x: auto; }
table.mt th, table.mt td { padding: 8px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line2); }
table.mt th:first-child, table.mt td:first-child { text-align: left; padding-left: 16px; position: sticky; left: 0; background: var(--surface); }
table.mt th { color: var(--ink2); font-weight: 500; font-size: 12px; }

/* ---------- charts ---------- */
.chartsvg { display: block; width: 100%; height: auto; overflow: visible; }
.chartsvg .gl { stroke: var(--line2); stroke-width: 1; }
.chartsvg .zero { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 2; }
.chartsvg .ax { font-size: 7px; fill: var(--ink3); font-family: var(--font-body); }
.chart-legend { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.lg-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.lg-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.lg-l { color: var(--ink2); flex: 1; min-width: 0; }
.lg-v { font-weight: 500; }
.donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donutsvg { width: 128px; height: 128px; flex: none; }
.donut-legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }

/* ---------- forms ---------- */
.field { margin-top: 12px; }
.field label, .lbl { display: block; font-size: 13px; color: var(--ink2); margin-bottom: 4px; }
.field small { display: block; color: var(--ink3); font-size: 12px; margin-top: 3px; }
input[type="text"], input[type="date"], input[type="time"], input[type="number"], input:not([type]), input[inputmode], select, textarea {
  width: 100%; font-size: 16px; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; min-height: 44px; color: var(--ink); appearance: none; -webkit-appearance: none;
}
input[type="range"] { accent-color: var(--accent); height: 32px; padding: 0; background: transparent; border: 0; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface2); border: 1px solid var(--line); padding: 3px; border-radius: 12px; }
.seg label { position: relative; margin: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 10px 6px; border-radius: 9px; font-weight: 500; color: var(--ink2); min-height: 44px; }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.seg input[value="BUY"]:checked + span, .seg input[value="BUY USD"]:checked + span, .seg input[value="Deposit"]:checked + span { background: var(--buy-soft); color: var(--buy); box-shadow: 0 0 0 1px var(--buy); }
.seg input[value="SELL"]:checked + span, .seg input[value="SELL USD"]:checked + span, .seg input[value="Withdrawal"]:checked + span { background: var(--sell-soft); color: var(--sell); box-shadow: 0 0 0 1px var(--sell); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.check-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 14px; }
.check-row input { width: 22px; height: 22px; min-height: 0; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.preview { margin-top: 14px; background: var(--surface2); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.preview .r { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.preview .r span:first-child { color: var(--ink2); }
.err { margin-top: 12px; color: var(--loss); font-size: 13.5px; min-height: 0; }
details.more { margin-top: 14px; border-top: 1px solid var(--line2); padding-top: 4px; }
details.more > summary { cursor: pointer; padding: 10px 0; color: var(--accent); font-size: 14px; font-weight: 500; min-height: 44px; display: flex; align-items: center; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; text-decoration: none; text-align: center; transition: transform .08s, filter .1s; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 40%, var(--line)); }
.btn.block { display: flex; width: 100%; }
.btn:active { filter: brightness(.94); transform: scale(.985); }
.btn[disabled] { opacity: .5; }
.actions { display: flex; gap: 10px; margin-top: 18px; }
.actions .btn { flex: 1; }
.actions .btn.primary { flex: 2; }
.btnlist { display: grid; gap: 10px; padding: 4px 16px 16px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--ink2); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- fab / tabs ---------- */
.fab {
  position: fixed; right: max(16px, calc((100vw - 680px) / 2 + 16px)); z-index: 15;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 20px 0 16px;
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .22); transition: transform .12s;
}
.fab:active { transform: scale(.96); }
.fab svg { width: 20px; height: 20px; }
.fab[hidden] { display: none; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { position: relative; background: transparent; border: 0; padding: 9px 2px 8px; min-height: 58px; color: var(--ink3); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 26%; right: 26%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab[aria-current="page"] svg { filter: drop-shadow(0 0 0 var(--accent)); }

/* ---------- sheet / dialog ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: none; }
.overlay.open { display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 680px; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .2s ease-out; box-shadow: 0 -8px 30px rgba(15, 27, 37, .18); }
.sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 3px; background: var(--line); margin: 2px auto 4px; }
.sheet:focus { outline: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -8px; background: var(--bg); padding: 8px 0 4px; z-index: 2; }
.sheet-head h3 { font-size: 17px; }
.dialog { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); margin: 0 auto; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 16px; }
.dialog p { margin: 0; white-space: pre-line; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity .18s; text-align: center; }
.toast.show { opacity: 1; }
textarea.mono { font-size: 12px; min-height: 120px; }

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .toast, details.panel > summary::after { transition: none; }
}
@media (min-width: 700px) {
  .hero-num { font-size: 46px; }
  .sheet { border-radius: 20px; bottom: 24px; }
}

</style>

<body>
<div id="offlineBar" class="offlinebar" hidden>ออฟไลน์ — ใช้งานได้ตามปกติ ข้อมูลอยู่ในเครื่องนี้แล้ว</div>
<header class="topbar"><div class="topbar-in">
  <h1 id="title">ภาพรวมพอร์ต</h1>
  <button id="pillCheck" class="pill" data-act="checks" hidden></button>
  <span id="pillSync" class="pill"></span>
</div></header>
<main id="main"></main>
<button id="fab" class="fab" data-act="add" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="fabLabel">เพิ่มรายการ</span></button>
<nav id="tabbar" class="tabbar" aria-label="เมนูหลัก"></nav>

<div id="dlgWrap" class="overlay" style="z-index:50"></div>
<div id="toastEl" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileXlsx" accept=".xlsx,.xls,.xlsm" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<noscript>ต้องเปิด JavaScript เพื่อใช้งานสมุดซื้อขาย</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===================== CORE: state, engine, importer ===================== */
function newState() {
  return {
    v: 1, updatedAt: 0, seq: 1,
    settings: {
      startValue: 0, tolerance: 0.01, usdThb: null,
      brokerCash: null, brokerValue: null,
      fxStartUsd: 0, fxStartThb: 0, fxStartCost: null,
      prices: {}, brokerShares: {}, defaultBroker: '',
      soundEnabled: true, soundVolume: 0.6,
      username: '',
      autoPrice: true, autoRate: true, notifEnabled: true,
      priceUpdatedAt: 0, rateUpdatedAt: 0,
      alerts: {}, alertsFired: {}
    },
    stocks: [], fx: [], cash: []
  };
}

function normalizeState(o) {
  const d = newState();
  if (!o || typeof o !== 'object') return d;
  d.updatedAt = Number(o.updatedAt) || 0;
  d.seq = Number(o.seq) || 1;
  Object.assign(d.settings, o.settings || {});
  d.settings.prices = Object.assign({}, (o.settings && o.settings.prices) || {});
  d.settings.brokerShares = Object.assign({}, (o.settings && o.settings.brokerShares) || {});
  if (o.settings && typeof o.settings.soundEnabled === 'boolean') d.settings.soundEnabled = o.settings.soundEnabled;
  if (o.settings && typeof o.settings.soundVolume === 'number' && o.settings.soundVolume >= 0 && o.settings.soundVolume <= 1) d.settings.soundVolume = o.settings.soundVolume;
  if (o.settings && typeof o.settings.username === 'string') d.settings.username = o.settings.username.slice(0, 50);
  if (o.settings && typeof o.settings.autoPrice === 'boolean') d.settings.autoPrice = o.settings.autoPrice;
  if (o.settings && typeof o.settings.autoRate === 'boolean') d.settings.autoRate = o.settings.autoRate;
  if (o.settings && typeof o.settings.notifEnabled === 'boolean') d.settings.notifEnabled = o.settings.notifEnabled;
  d.settings.priceUpdatedAt = Number(o.settings && o.settings.priceUpdatedAt) || 0;
  d.settings.rateUpdatedAt = Number(o.settings && o.settings.rateUpdatedAt) || 0;
  d.settings.alerts = Object.assign({}, (o.settings && o.settings.alerts) || {});
  d.settings.alertsFired = Object.assign({}, (o.settings && o.settings.alertsFired) || {});
  ['stocks', 'fx', 'cash'].forEach(k => { d[k] = Array.isArray(o[k]) ? o[k].filter(x => x && typeof x === 'object') : []; });
  let maxSeq = 0;
  ['stocks', 'fx', 'cash'].forEach(k => d[k].forEach((r, i) => {
    if (!r.id) r.id = 'r' + k[0] + i + '_' + Math.random().toString(36).slice(2, 8);
    if (!r.seq) r.seq = ++maxSeq; else maxSeq = Math.max(maxSeq, r.seq);
  }));
  d.seq = Math.max(d.seq, maxSeq + 1);
  return d;
}

/* ---------- helpers ---------- */
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const x = parseFloat(String(v).replace(/[,฿$\s]/g, ''));
  return isFinite(x) ? x : null;
}
function N(v) { const x = num(v); return x === null ? 0 : x; }
function cmpRows(a, b) {
  return (a.date || '').localeCompare(b.date || '') ||
    (a.time || '').localeCompare(b.time || '') ||
    ((a.seq || 0) - (b.seq || 0));
}
const EPS = 1e-7;

/* ---------- Cash Flow (ฝาก/ถอน บัญชีเทรดจริง) ---------- */
function computeCash(S) {
  const rows = S.cash.slice().sort(cmpRows);
  let dep = 0, wd = 0, fees = 0, nonUsd = 0, missing = 0;
  const out = [];
  for (const r of rows) {
    const amount = num(r.amount), fee = N(r.fee);
    const cur = r.currency ? String(r.currency).toUpperCase() : 'USD';
    const validType = r.type === 'Deposit' || r.type === 'Withdrawal';
    const o = Object.assign({}, r, { amount, fee, cur, usdAmt: null, usdFee: null, impact: null, status: 'OK' });
    if (amount === null && !validType && !r.date) { o.status = 'Incomplete'; out.push(o); continue; }
    if (amount !== null && (!r.date || !validType)) { missing++; o.status = 'Incomplete'; out.push(o); continue; }
    if (amount === null || !validType) { o.status = 'Incomplete'; out.push(o); continue; }
    if (r.currency && cur !== 'USD') nonUsd++;
    const usdAmt = cur === 'USD' ? amount : 0, usdFee = cur === 'USD' ? fee : 0;
    o.usdAmt = usdAmt; o.usdFee = usdFee;
    o.impact = r.type === 'Deposit' ? usdAmt - usdFee : -(usdAmt + usdFee);
    if (r.type === 'Deposit') dep += usdAmt; else wd += usdAmt;
    fees += usdFee;
    out.push(o);
  }
  return { rows: out, dep, wd, fees, nonUsd, missing, net: dep - wd - fees };
}

/* ---------- Stock Transactions (Average Cost) ---------- */
/* หมายเหตุสกุลเงิน: ต้นทุนเฉลี่ยต่อหุ้น (avg) และกำไรขาดทุนที่ขายแล้ว (pl) คำนวณในสกุลเงินเดิมของธุรกรรมนั้นๆ เสมอ (ต่อ asset หนึ่งตัวมักซื้อขายสกุลเดียวกันตลอด)
   ส่วนเงินสดของพอร์ต (cumBuy/cumSell/cashAfter) เป็น USD ล้วน ห้ามนำ THB ไปบวกตรงๆ — ถ้าเป็น THB ต้องแปลงเป็น USD ด้วย fxRate ที่กรอก หรือเรท USD/THB ปัจจุบันก่อนเสมอ */
function computeStocks(S, cash) {
  cash = cash || computeCash(S);
  const rows = S.stocks.slice().sort(cmpRows);
  const start = N(S.settings.startValue);
  const tol = S.settings.tolerance == null ? 0.01 : N(S.settings.tolerance);
  const rateNow = num(S.settings.usdThb);
  const cf = cash.rows.filter(r => r.impact !== null && r.date);
  const per = {};
  let cumBuy = 0, cumSell = 0, fees = 0, nonUsd = 0, oversell = 0, incomplete = 0, negCash = 0, realized = 0, fxMissing = 0;
  const out = [];
  for (const r of rows) {
    const asset = String(r.asset || '').trim().toUpperCase();
    const action = String(r.action || '').toUpperCase();
    const shares = num(r.shares), price = num(r.price), fee = N(r.fee);
    const cur = r.currency ? String(r.currency).toUpperCase() : 'USD';
    const o = Object.assign({}, r, {
      asset, action, shares, price, fee, cur,
      gross: null, net: null, netUsd: null, thb: null, cost: null, pl: null, sharesAfter: null, cashAfter: null, status: 'OK'
    });
    const complete = r.date && asset && (action === 'BUY' || action === 'SELL') &&
      shares !== null && price !== null && shares > 0 && price > 0;
    if (!complete) { o.status = 'Incomplete'; incomplete++; out.push(o); continue; }
    if (r.currency && cur !== 'USD') nonUsd++;
    const p = per[asset] || (per[asset] = { bs: 0, ss: 0, bn: 0, scb: 0, rl: 0, count: 0 });
    p.count++;
    const gross = shares * price;
    const net = action === 'BUY' ? gross + fee : gross - fee;
    o.gross = gross; o.net = net; fees += fee;
    const fxRate = num(r.fxRate);
    const useRate = fxRate || rateNow; // ให้ความสำคัญกับเรทที่กรอกในรายการก่อน ถ้าไม่มีค่อยใช้เรทตลาดปัจจุบัน
    o.thb = cur === 'THB' ? net : (useRate ? net * useRate : null);
    // netUsd: มูลค่าสุทธิแปลงเป็น USD แล้ว — ใช้ตัวนี้เท่านั้นในการคำนวณเงินสดรวมของพอร์ต ห้ามใช้ net (สกุลเดิม) ปนกัน
    if (cur === 'USD') o.netUsd = net;
    else if (useRate) o.netUsd = net / useRate;
    else { o.netUsd = null; fxMissing++; }
    if (action === 'SELL') {
      const held = p.bs - p.ss;
      const avg = held !== 0 ? (p.bn - p.scb) / held : 0; // ต้นทุนเฉลี่ยในสกุลเงินเดิมของ asset นี้
      const cost = shares * avg;
      o.cost = cost; o.pl = net - cost; // กำไร/ขาดทุนในสกุลเงินเดิม (แสดงผลรายแถว)
      const plUsd = cur === 'USD' ? o.pl : (useRate ? o.pl / useRate : null); // แปลงเป็น USD ก่อนรวมยอดพอร์ต
      p.ss += shares; p.scb += cost; p.rl += o.pl;
      if (plUsd !== null) realized += plUsd;
      if (o.netUsd !== null) cumSell += o.netUsd;
    } else {
      p.bs += shares; p.bn += net; // ต้นทุนสะสมเก็บในสกุลเดิม เพื่อให้ต้นทุนเฉลี่ย/กำไรขาดทุนของ asset นี้ยังถูกต้อง
      if (o.netUsd !== null) cumBuy += o.netUsd;
    }
    o.sharesAfter = p.bs - p.ss;
    let cfSum = 0;
    for (const c of cf) if (c.date <= r.date) cfSum += c.impact;
    o.cashAfter = start + cfSum + cumSell - cumBuy;
    if (action === 'SELL' && o.sharesAfter < -EPS) { o.status = 'SELL > held'; oversell++; }
    if (o.netUsd === null) o.status = 'NO FX RATE';
    if (o.cashAfter < -tol) negCash++;
    out.push(o);
  }
  return { rows: out, per, buys: cumBuy, sells: cumSell, fees, realized, nonUsd, oversell, incomplete, negCash, fxMissing };
}

/* ---------- FX (THB <-> USD) ---------- */
function computeFX(S) {
  const rows = S.fx.slice().sort(cmpRows);
  const st = S.settings;
  const startUsd = N(st.fxStartUsd), startThb = N(st.fxStartThb);
  const startCost = num(st.fxStartCost);
  const openLot = startCost !== null && startUsd > 0;   // ต้นทุน USD ตั้งต้น (ไม่บังคับ)
  const rateNow = num(st.usdThb);
  let cBuyUsd = 0, cSellUsd = 0, cBuyThb = 0, cSellThb = 0, cFee = 0, cBuyFee = 0;
  let sellCount = 0, refCount = 0, realizedTotal = 0, minBal = null, last = null;
  const out = [];
  for (const r of rows) {
    const action = String(r.action || '');
    const thb = num(r.thb), usd = num(r.usd), fee = N(r.fee);
    const o = Object.assign({}, r, {
      action, thb, usd, fee, rate: null, netUsd: null, usdBal: null, thbBal: null,
      avgCost: null, plNow: null, realized: null, status: 'OK'
    });
    if (!r.date || (action !== 'BUY USD' && action !== 'SELL USD') || thb === null || usd === null || usd === 0) {
      o.status = 'Incomplete'; out.push(o); continue;
    }
    o.rate = thb / usd;
    o.netUsd = action === 'BUY USD' ? usd : -usd;
    const usdBefore = cBuyUsd + (openLot ? startUsd : 0);
    const costBefore = cBuyThb + cBuyFee + (openLot ? startUsd * startCost : 0);
    if (action === 'BUY USD') { cBuyUsd += usd; cBuyThb += thb; cBuyFee += fee; }
    else { cSellUsd += usd; cSellThb += thb; }
    cFee += fee;
    o.usdBal = startUsd + cBuyUsd - cSellUsd;
    o.thbBal = startThb - cBuyThb + cSellThb - cFee;
    const M = cBuyUsd + (openLot ? startUsd : 0);
    const Ncost = cBuyThb + cBuyFee + (openLot ? startUsd * startCost : 0);
    o.avgCost = M ? Ncost / M : 0;
    if (rateNow !== null) o.plNow = o.usdBal * (rateNow - o.avgCost);
    if (action === 'SELL USD') {
      sellCount++;
      if (usdBefore > 0) {
        o.realized = thb - fee - usd * (costBefore / usdBefore);
        realizedTotal += o.realized; refCount++;
      }
    }
    minBal = minBal === null ? o.usdBal : Math.min(minBal, o.usdBal);
    last = o;
    out.push(o);
  }
  const usdNow = last ? last.usdBal : startUsd;
  const avgCost = last ? last.avgCost : (openLot ? startCost : 0);
  const totalCost = usdNow * avgCost;
  const valueNow = rateNow !== null ? usdNow * rateNow : null;
  const unreal = valueNow !== null ? valueNow - totalCost : null;
  return {
    rows: out, usdNow, avgCost, totalCost, rateNow, valueNow, unreal,
    unrealPct: unreal !== null && totalCost ? unreal / totalCost : null,
    realized: realizedTotal, total: unreal !== null ? realizedTotal + unreal : null,
    usdBought: cBuyUsd, usdSold: cSellUsd, thbBought: cBuyThb, thbSold: cSellThb, fees: cFee,
    minBal: minBal === null ? 0 : minBal, sellCount, sellNoRef: sellCount - refCount
  };
}

/* ---------- Summary / checks / monthly ---------- */
function computeAll(S) {
  const cash = computeCash(S);
  const st = computeStocks(S, cash);
  const fx = computeFX(S);
  const set = S.settings;
  const tol = set.tolerance == null ? 0.01 : N(set.tolerance);
  const start = N(set.startValue);

  const holdings = Object.keys(st.per).sort().map(t => {
    const p = st.per[t];
    const shares = p.bs - p.ss;
    const cost = p.bn - p.scb;
    const zero = Math.abs(shares) < EPS;
    const price = num(set.prices[t]);
    const mv = zero ? 0 : (price === null ? null : shares * price);
    const unreal = mv === null ? null : mv - cost;
    const bShares = num(set.brokerShares[t]);
    const diff = bShares === null ? null : shares - bShares;
    let status = 'OK';
    if (!zero && price === null) status = 'NO PRICE';
    else if (diff !== null && Math.abs(diff) > 0.0001) status = 'SHARES DIFF';
    return {
      t, shares, cost, zero, price, mv, unreal, realized: p.rl, count: p.count,
      avg: zero ? 0 : cost / shares,
      unrealPct: unreal !== null && Math.abs(cost) >= 0.005 ? unreal / cost : null,
      total: unreal === null ? null : p.rl + unreal,
      bShares, diff, status
    };
  });

  const mvTotal = holdings.reduce((a, h) => a + (h.mv === null ? 0 : h.mv), 0);
  const unreal = holdings.reduce((a, h) => a + (h.unreal === null ? 0 : h.unreal), 0);
  const costHold = holdings.reduce((a, h) => a + h.cost, 0);
  const realized = st.realized;

  const curCash = start + cash.dep - cash.wd - cash.fees + st.sells - st.buys;
  const value = curCash + mvTotal;
  const walk = start + cash.dep - cash.wd + realized + unreal - cash.fees;
  const walkDiff = walk - value;
  const capital = start + cash.dep;
  const ret = realized + unreal - cash.fees;
  const noPrice = holdings.filter(h => h.status === 'NO PRICE').length;
  const sharesDiff = holdings.filter(h => h.status === 'SHARES DIFF').length;

  // ---- checks ----
  const checks = [];
  const bc = num(set.brokerCash), bv = num(set.brokerValue);
  checks.push({
    key: 'recon-cash', group: 'recon', label: 'เงินสดที่คำนวณ เทียบกับโบรกเกอร์',
    status: bc === null ? 'NO INPUT' : (Math.abs(curCash - bc) <= tol ? 'OK' : 'CHECK'),
    detail: bc === null ? 'ยังไม่ใส่ยอดจริง (ใส่ได้ในตั้งค่า)' : 'คำนวณ ' + curCash.toFixed(2) + ' · จริง ' + bc.toFixed(2) + ' · ต่าง ' + (curCash - bc).toFixed(2)
  });
  checks.push({
    key: 'recon-value', group: 'recon', label: 'มูลค่าพอร์ตที่คำนวณ เทียบกับโบรกเกอร์',
    status: bv === null ? 'NO INPUT' : (Math.abs(value - bv) <= tol ? 'OK' : 'CHECK'),
    detail: bv === null ? 'ยังไม่ใส่ยอดจริง (ใส่ได้ในตั้งค่า)' : 'คำนวณ ' + value.toFixed(2) + ' · จริง ' + bv.toFixed(2) + ' · ต่าง ' + (value - bv).toFixed(2)
  });
  checks.push({
    key: 'walk', group: 'recon', label: 'สมการมูลค่าพอร์ต (ตั้งต้น + ฝาก − ถอน + กำไร)',
    status: Math.abs(walkDiff) <= tol ? 'OK' : 'CHECK',
    detail: Math.abs(walkDiff) <= tol ? 'ตรงกับเงินสด + หุ้น' : 'ผลต่าง ' + walkDiff.toFixed(2) + ' — อาจขาดราคาปัจจุบัน หรือขายเกินที่ถือ'
  });
  const fxUsdNet = N(set.fxStartUsd) + fx.usdBought - fx.usdSold;
  const cfNet = cash.dep - cash.wd;
  const fxDiff = fxUsdNet - cfNet;
  checks.push({
    key: 'fx-vs-cf', group: 'recon', label: 'USD จากแลกเงินสุทธิ เทียบกับฝาก−ถอนบัญชีเทรด',
    status: fxDiff < -tol ? 'CHECK' : 'INFO',
    detail: 'แลกเงินสุทธิ ' + fxUsdNet.toFixed(2) + ' · ฝาก−ถอน ' + cfNet.toFixed(2) + ' · ส่วนต่าง ' + fxDiff.toFixed(2) + (fxDiff < -tol ? ' (ติดลบ = ฝากมากกว่าที่แลก หรือข้อมูลแลกเงินไม่ครบ)' : ' (ค้างนอกบัญชีเทรด ควร ≥ 0)')
  });
  const cnt = (key, label, n, hint) => checks.push({ key, group: 'data', label, count: n, status: n > 0 ? 'CHECK' : 'OK', detail: n > 0 ? n + ' รายการ' + (hint ? ' — ' + hint : '') : 'ปกติ' });
  cnt('oversell', 'หุ้น: ขายเกินจำนวนที่ถืออยู่', st.oversell, 'ตรวจจำนวนหุ้นหรือวันที่');

function monthlyCash(C) {

  });

/* จุดสะสมตามเวลา: เงินทุนสะสม (ตั้งต้น+ฝาก-ถอน) เทียบกับกำไรที่ขายแล้วสะสม */
function equityCurve(S, C) {
  const start = N(S.settings.startValue);
  const events = [];
  C.cash.rows.forEach(r => { if (r.status === 'OK' && r.date && r.cur === 'USD') events.push({ date: r.date, cap: r.type === 'Deposit' ? r.usdAmt : -r.usdAmt, real: 0 }); });
  C.st.rows.forEach(r => { if (r.action === 'SELL' && r.pl !== null && r.date) events.push({ date: r.date, cap: 0, real: r.pl }); });
  if (!events.length) return [{ date: '', capital: start, realized: 0 }];
  events.sort((a, b) => a.date.localeCompare(b.date));
  const out = [{ date: events[0].date, capital: start, realized: 0 }];
  let cap = start, real = 0;
  events.forEach(e => {
    cap += e.cap; real += e.real;
    const last = out[out.length - 1];
    if (last.date === e.date) { last.capital = cap; last.realized = real; }
    else out.push({ date: e.date, capital: cap, realized: real });
  });
  return out;
}

function monthlyStats(C) {
  const m = {};
  const get = k => m[k] || (m[k] = { k, n: 0, buyUsd: 0, sellUsd: 0, buyThb: 0, sellThb: 0, fee: 0, plStock: 0, sells: 0 });
  C.fx.rows.forEach(r => {
    if (r.status !== 'OK') return;
    const g = get(r.date.slice(0, 7)); g.n++; g.fee += r.fee;
    if (r.action === 'BUY USD') { g.buyUsd += r.usd; g.buyThb += r.thb; } else { g.sellUsd += r.usd; g.sellThb += r.thb; }
  });
  C.st.rows.forEach(r => {
    if (r.action === 'SELL' && r.pl !== null) { const g = get(r.date.slice(0, 7)); g.plStock += r.pl; g.sells++; }
  });
  return Object.values(m).sort((a, b) => a.k.localeCompare(b.k)).map(g => Object.assign(g, {
    avgBuy: g.buyUsd ? g.buyThb / g.buyUsd : null,
    avgSell: g.sellUsd ? g.sellThb / g.sellUsd : null
  }));
}

function ymd(y, m, d) { return String(y).padStart(4, '0') + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
function parseDate(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number' && v > 20000 && v < 90000) {
    return new Date(Math.floor(v) * 86400000 - 2209161600000).toISOString().slice(0, 10);
  }
  if (typeof v === 'string') {
    const s = v.trim(); let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return ymd(m[1], m[2], m[3]);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return ymd(m[3], m[2], m[1]);
  }
  return '';
}
function txt(v) { if (v === null || v === undefined) return ''; const s = String(v).trim(); return s === '-' ? '' : s; }
function findSheet(sheets, re) { const k = Object.keys(sheets).find(n => re.test(n)); return k ? sheets[k] : null; }
function headerInfo(aoa) {
  for (let i = 0; i < Math.min(aoa.length, 25); i++) {
    const row = aoa[i] || [];
    if (row.some(c => String(c == null ? '' : c).trim() === 'Date')) {
      const map = {};
      row.forEach((c, j) => { const h = String(c == null ? '' : c).trim(); if (h && !(h in map)) map[h] = j; });
      return { hi: i, map };
    }
  }
  return null;
}
function blank(v) { return v === null || v === undefined || v === ''; }

function importSheets(sheets) {
  const S = newState();
  let seq = 1;
  const st = findSheet(sheets, /stock transactions/i);
  if (st) {
    const h = headerInfo(st);
    if (h) {
      const g = (row, k) => (k in h.map ? row[h.map[k]] : null);
      for (let i = h.hi + 1; i < st.length; i++) {
        const row = st[i] || [];
        const core = ['Date', 'Asset', 'Action', 'Shares', 'Price per Share'].map(k => g(row, k));
        if (core.every(blank)) continue;
        S.stocks.push({

          date: parseDate(g(row, 'Date')), time: txt(g(row, 'Time')),

          shares: num(g(row, 'Shares')), price: num(g(row, 'Price per Share')),

          txId: txt(g(row, 'Transaction ID')), broker: txt(g(row, 'Broker')),
          note: txt(g(row, 'Note')), source: txt(g(row, 'Source'))

    }
  }
  const fx = findSheet(sheets, /fx transactions/i);
  if (fx) {
    const h = headerInfo(fx);
    if (h) {
      const g = (row, k) => (k in h.map ? row[h.map[k]] : null);
      for (let i = h.hi + 1; i < fx.length; i++) {
        const row = fx[i] || [];
        const core = ['Date', 'Action', 'THB Used/Received', 'USD Received/Used'].map(k => g(row, k));
        if (core.every(blank)) continue;
        S.fx.push({
          id: 'f' + seq + '_' + Math.random().toString(36).slice(2, 7), seq: seq++,
          date: parseDate(g(row, 'Date')), action: txt(g(row, 'Action')).toUpperCase(),
          thb: num(g(row, 'THB Used/Received')), usd: num(g(row, 'USD Received/Used')),

    }
  }
  const cf = findSheet(sheets, /cash flow/i);
  if (cf) {
    const h = headerInfo(cf);
    if (h) {
      const g = (row, k) => (k in h.map ? row[h.map[k]] : null);
      for (let i = h.hi + 1; i < cf.length; i++) {
        const row = cf[i] || [];
        const core = ['Date', 'Type', 'Amount'].map(k => g(row, k));
        if (core.every(blank)) continue;
        const t = txt(g(row, 'Type')).toLowerCase();
        const linkedFx = txt(g(row, 'Linked FX Id'));
        S.cash.push(Object.assign({
          id: 'c' + seq + '_' + Math.random().toString(36).slice(2, 7), seq: seq++,
          date: parseDate(g(row, 'Date')), type: t === 'deposit' ? 'Deposit' : t === 'withdrawal' ? 'Withdrawal' : '',
          amount: num(g(row, 'Amount')), currency: txt(g(row, 'Currency')) || 'USD', fee: N(g(row, 'Fee')),
          source: txt(g(row, 'Source')), note: txt(g(row, 'Note'))
        }, linkedFx ? { mirrorFxId: linkedFx } : {}));
      }
    }
  }
  S.seq = seq;

  // ---- settings ----
  const set = S.settings;
  const kv = findSheet(sheets, /^settings$/i);
  if (kv) {
    kv.forEach(row => {
      if (!row) return;
      const k = txt(row[0]), v = row[1];
      if (k === 'startValue') set.startValue = N(v);
      else if (k === 'tolerance') set.tolerance = num(v) === null ? 0.01 : num(v);
      else if (k === 'usdThb') set.usdThb = num(v);
      else if (k === 'brokerCash') set.brokerCash = num(v);
      else if (k === 'brokerValue') set.brokerValue = num(v);
      else if (k === 'fxStartUsd') set.fxStartUsd = N(v);
      else if (k === 'fxStartThb') set.fxStartThb = N(v);
      else if (k === 'fxStartCost') set.fxStartCost = num(v);
      else if (k === 'username') set.username = String(v || '').slice(0, 50);
      else if (k.startsWith('price:')) { const p = num(v); if (p !== null) set.prices[k.slice(6).toUpperCase()] = p; }
      else if (k.startsWith('brokerShares:')) { const p = num(v); if (p !== null) set.brokerShares[k.slice(13).toUpperCase()] = p; }
    });
  } else {
    const ps = findSheet(sheets, /portfolio summary/i);
    if (ps) {
      let inTable = false;
      ps.forEach(row => {
        if (!row) return;
        const a = txt(row[0]);
        if (a === 'Starting Portfolio Value (USD)') set.startValue = N(row[1]);
        else if (a === 'Broker Actual Cash (USD)') set.brokerCash = num(row[1]);
        else if (a === 'Broker Actual Portfolio Value (USD)') set.brokerValue = num(row[1]);
        else if (a === 'Tolerance (USD)' && num(row[1]) !== null) set.tolerance = num(row[1]);
        if (a === 'Asset' && txt(row[1]) === 'Shares Held') { inTable = true; return; }
        if (inTable) {
          if (a === 'TOTAL' || a === '') { if (a === 'TOTAL') inTable = false; return; }
          const p = num(row[4]), bs = num(row[10]);
          if (p !== null) set.prices[a.toUpperCase()] = p;
          if (bs !== null) set.brokerShares[a.toUpperCase()] = bs;
        }
      });
    }
    const fxs = findSheet(sheets, /fx transactions/i);
    if (fxs) {
      for (let i = 0; i < Math.min(fxs.length, 6); i++) {
        const row = fxs[i] || [];
        row.forEach((c, j) => {
          const s = txt(c);
          if (s.startsWith('ยอดเริ่มต้น USD')) set.fxStartUsd = N(row[j + 1]);
          if (s.startsWith('ยอดเริ่มต้น THB')) set.fxStartThb = N(row[j + 1]);
        });
      }
    }
    const db = findSheet(sheets, /^dashboard$/i);
    if (db) {
      db.forEach(row => {
        if (!row) return;
        row.forEach((c, j) => {
          if (txt(c).startsWith('เรทตลาดปัจจุบัน')) {
            for (let k = j + 1; k < row.length; k++) { const v = num(row[k]); if (v !== null) { set.usdThb = v; break; } }
          }
        });
      });
    }
  }
  return S;
}

/* ---------- format ---------- */
function money(n, sym, o) {
  o = o || {}; sym = sym === undefined ? '$' : sym;
  if (n === null || n === undefined || !isFinite(n)) return '–';
  const dec = o.dec === undefined ? 2 : o.dec;
  const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const zero = Number(Math.abs(n).toFixed(dec)) === 0;
  return (zero ? '' : (n < 0 ? MINUS : (o.sign ? '+' : ''))) + sym + s;
}

}

/* ---------- ระบบเสียงแจ้งเตือน (สังเคราะห์เอง ไม่ใช้ไฟล์เสียงภายนอก ทำงานออฟไลน์ได้ทันที) ---------- */
const audio = { ctx: null, unlocked: false };
function ensureAudioCtx() {
  if (audio.ctx) return audio.ctx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audio.ctx = new Ctx();
  } catch (e) { return null; }
  return audio.ctx;
}
// เปิดใช้งาน AudioContext หลัง user interaction ครั้งแรกเท่านั้น (autoplay policy)
function unlockAudioOnce() {
  if (audio.unlocked) return;
  audio.unlocked = true;
  const ctx = ensureAudioCtx();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
  document.removeEventListener('pointerdown', unlockAudioOnce);
}
document.addEventListener('pointerdown', unlockAudioOnce, { once: true });

function playTone(freq, startAt, dur, ctx, gainNode, type) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startAt;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(1, t0 + 0.012);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  osc.connect(g); g.connect(gainNode);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
// ประเภทเสียง: success (บันทึก/นำเข้า/ส่งออก/สำรอง/กู้คืนสำเร็จ), error (ผิดพลาด/validation), warn (แจ้งเตือนทั่วไป)
const SOUND_PATTERNS = {
  success: [[880, 0, 0.09, 'sine'], [1318.5, 0.07, 0.13, 'sine']],
  error: [[220, 0, 0.09, 'square'], [180, 0.1, 0.12, 'square']],
  warn: [[440, 0, 0.14, 'sine']]
};
function playSound(kind) {
  try {
    if (!S.settings.soundEnabled) return;
    const ctx = ensureAudioCtx();
    if (!ctx || ctx.state === 'suspended') return; // ยังไม่ปลดล็อกจาก interaction ก็แค่เงียบ ไม่ error
    const vol = Math.max(0, Math.min(1, S.settings.soundVolume));
    if (vol <= 0) return;
    const master = ctx.createGain();
    master.gain.value = vol * 0.5;
    master.connect(ctx.destination);
    (SOUND_PATTERNS[kind] || SOUND_PATTERNS.success).forEach(([freq, at, dur, type]) => playTone(freq, at, dur, ctx, master, type));
  } catch (e) { /* ห้ามให้เสียงทำระบบหลัก error เด็ดขาด */ }
}

function lineChart(series, opts) {
  opts = opts || {};

  const n = series[0].points.length;
  if (n < 2) return '';
  const allY = series.flatMap(s => s.points.map(p => p.y));
  let maxY = Math.max(0, ...allY), minY = Math.min(0, ...allY);
  if (maxY === minY) { maxY += 1; minY -= 1; }
  const x = i => PL + (W - PL - PR) * (i / (n - 1));
  const y = v => H - PB - (H - PT - PB) * ((v - minY) / (maxY - minY));
  let grid = '';
  for (let i = 0; i <= 3; i++) { const yy = y(minY + (maxY - minY) * i / 3); grid += `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W - PR}" y2="${yy.toFixed(1)}" class="gl"/>`; }
  const zy = y(Math.max(minY, Math.min(maxY, 0)));
  const idx = [0, Math.floor((n - 1) / 2), n - 1];
  const labels = idx.map(i => `<text x="${x(i).toFixed(1)}" y="${H - 4}" class="ax" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(series[0].points[i].x)}</text>`).join('');
  const paths = series.map(s => {
    const d = s.points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.y).toFixed(1)).join(' ');
    const last = s.points[n - 1];
    return `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1).toFixed(1)}" cy="${y(last.y).toFixed(1)}" r="2.6" style="fill:${s.color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chartsvg" role="img" aria-label="${esc(opts.aria || '')}">${grid}<line x1="${PL}" y1="${zy.toFixed(1)}" x2="${W - PR}" y2="${zy.toFixed(1)}" class="zero"/>${paths}${labels}</svg>`;

  for (let i = 0; i <= 3; i++) { const v = minY + (maxY - minY) * i / 3; const yy = y(v); grid += `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W - PR}" y2="${yy.toFixed(1)}" class="gl"/><text x="0" y="${(yy - 2).toFixed(1)}" class="ax">${v.toFixed(1)}</text>`; }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.rate).toFixed(1)).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.rate).toFixed(1)}" r="2.3" style="fill:${p.action === 'BUY USD' ? 'var(--buy)' : 'var(--sell)'}"/>`).join('');
  const li = [0, n - 1];

  return `<svg viewBox="0 0 ${W} ${H}" class="chartsvg" role="img" aria-label="${esc((opts && opts.aria) || '')}">${grid}<path d="${d}" fill="none" style="stroke:var(--ink3)" stroke-width="1.5"/>${dots}${labels}</svg>`;
}
function barChart(cats, series, opts) {
  opts = opts || {};

  const groupW = (W - PL - PR) / n;

  const y = v => H - PB - (H - PT - PB) * (v / maxV);
  let grid = '';
  for (let i = 0; i <= 3; i++) { const yy = y(maxV * i / 3); grid += `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W - PR}" y2="${yy.toFixed(1)}" class="gl"/>`; }
  const step = Math.ceil(n / 6);
  let bars = '';
  cats.forEach((c, i) => {
    const gx = PL + groupW * i + groupW / 2 - (series.length * barW) / 2;
    series.forEach((s, si) => {
      const v = s.values[i] || 0, bx = gx + si * barW, by = y(v);
      bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0, H - PB - by).toFixed(1)}" rx="1.5" style="fill:${s.color}"/>`;
    });
    if (i % step === 0 || i === n - 1) bars += `<text x="${(PL + groupW * i + groupW / 2).toFixed(1)}" y="${H - 4}" class="ax" text-anchor="middle">${esc(c.label)}</text>`;
  });

}
function barLegend(series, fmt) {
  return series.map(s => `<div class="lg-item"><span class="lg-dot" style="background:${s.color}"></span><span class="lg-l">${esc(s.name)}</span><span class="lg-v">${fmt(s.values.reduce((a, b) => a + b, 0))}</span></div>`).join('');
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10; return m * p; }

  const R = 60, r = 38, cx = 70, cy = 70;
  let a0 = -Math.PI / 2, paths = '';
  segs.forEach(s => {
    const frac = s.value / total, a1 = a0 + frac * Math.PI * 2, large = (a1 - a0) > Math.PI ? 1 : 0;
    if (frac >= 0.9995) { paths += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" style="stroke:${s.color}" stroke-width="${R - r}"/>`; a0 = a1; return; }
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const ix0 = cx + r * Math.cos(a1), iy0 = cy + r * Math.sin(a1), ix1 = cx + r * Math.cos(a0), iy1 = cy + r * Math.sin(a0);
    paths += `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${ix0.toFixed(2)} ${iy0.toFixed(2)} A${r} ${r} 0 ${large} 0 ${ix1.toFixed(2)} ${iy1.toFixed(2)} Z" style="fill:${s.color}"/>`;
    a0 = a1;
  });
  const legend = segs.map(s => `<div class="lg-item"><span class="lg-dot" style="background:${s.color}"></span><span class="lg-l">${esc(s.label)}</span><span class="lg-v">${money(s.value, '$', { dec: 0 })} · ${pct(s.value / total)}</span></div>`).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 140 140" class="donutsvg" role="img" aria-label="${esc(opts.aria || '')}">${paths}</svg><div class="donut-legend">${legend}</div></div>`;
}

const remote = { db: null, path: null, timer: null, busy: false, again: false, status: 'local' };

function setSync(s) {

async function initRemote() {

    remote.db = db; remote.path = 'data/users/' + id + '/ledger';
    const snap = await db.doc(remote.path).get();
    let push = false;
    if (snap.exists) {
      const d = snap.data() || {};
      const ru = Number(d.updatedAt) || 0;
      if (ru > (S.updatedAt || 0) && typeof d.json === 'string') {
        S = normalizeState(JSON.parse(d.json)); S.updatedAt = ru; saveLocal(); render();

function scheduleRemote() {

}
async function flushRemote() {

    await remote.db.doc(remote.path).set({ v: 1, updatedAt: stamp, json: JSON.stringify(S) });

// ป้องกันแจ้งเตือนซ้ำรัวๆ: เก็บ flag ต่อ ticker/ประเภทไว้ใน S.settings.alertsFired ยิงครั้งเดียวต่อการข้ามเส้นแต่ละครั้ง (ราคาต้องกลับไปฝั่งตรงข้ามก่อนถึงจะยิงซ้ำได้)
async function requestNotifPermission() {
  if (!('Notification' in window)) { toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนแบบระบบ (ใช้เสียง+ข้อความในแอปแทนได้)'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { toast('เปิดการแจ้งเตือนแล้ว'); notify('success', 'ทดสอบการแจ้งเตือน', 'สมุดซื้อขายจะแจ้งเตือนคุณแบบนี้'); }
    else toast('ยังไม่ได้รับอนุญาตแจ้งเตือนจากเบราว์เซอร์');
  } catch (e) { toast('เปิดการแจ้งเตือนไม่สำเร็จ'); }
  render();
}
function notify(kind, title, body) {
  toast(body ? title + ' — ' + body : title);
  playSound(kind === 'error' ? 'error' : kind === 'warn' ? 'warn' : 'success');
  if (S.settings.notifEnabled && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body: body || '', tag: title, icon: './icon-192.png' }); } catch (e) { /* ห้ามให้แจ้งเตือนทำแอปพัง */ }
  }
}
function checkPriceAlerts() {
  const st = S.settings; let changed = false;
  Object.keys(st.alerts).forEach(t => {
    const a = st.alerts[t]; if (!a) return;
    const price = num(st.prices[t]); if (price === null) return;
    if (!st.alertsFired[t]) st.alertsFired[t] = {};
    const fired = st.alertsFired[t];
    const tgt = num(a.target), stp = num(a.stop);
    if (tgt !== null) {
      const hit = price >= tgt;
      if (hit && !fired.target) {
        fired.target = true; changed = true;
        notify('warn', 'ถึงราคาเป้าหมาย: ' + t, t + ' ราคาปัจจุบัน ' + money(price) + ' · เป้าหมาย ' + money(tgt) + ' · ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }));
      } else if (!hit && fired.target) { fired.target = false; changed = true; }
    }
    if (stp !== null) {
      const hit = price <= stp;
      if (hit && !fired.stop) {
        fired.stop = true; changed = true;
        notify('error', 'ถึงจุด Stop Loss: ' + t, t + ' ราคาปัจจุบัน ' + money(price) + ' · Stop Loss ' + money(stp) + ' · ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }));
      } else if (!hit && fired.stop) { fired.stop = false; changed = true; }
    }
  });
  if (changed) saveLocal();
}

const live = { priceStatus: 'idle', rateStatus: 'idle', priceBusy: false, rateBusy: false, priceTimer: null, rateTimer: null };
const PRICE_REFRESH_MS = 60000, RATE_REFRESH_MS = 60000;
async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('http ' + res.status);
  return res.json();
}
function heldTickers() { return Object.keys(C.st.per).filter(t => Math.abs(C.st.per[t].bs - C.st.per[t].ss) > 1e-7); }
async function refreshPricesNow() {
  const tickers = heldTickers();
  if (!tickers.length) { toast('ยังไม่มีหุ้นที่ถืออยู่'); return; }
  if (live.priceBusy) return;
  live.priceBusy = true; live.priceStatus = 'updating'; render();
  let got = {};
  try {
    if (!navigator.onLine) throw new Error('offline');
    const data = await fetchJson('https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + encodeURIComponent(tickers.join(',')));
    const results = (data && data.quoteResponse && data.quoteResponse.result) || [];
    results.forEach(q => { if (q && q.symbol && isFinite(q.regularMarketPrice)) got[String(q.symbol).toUpperCase()] = q.regularMarketPrice; });
  } catch (e) { /* จะลองทีละตัวด้านล่างต่อ ไม่ต้อง throw ทิ้งตรงนี้ */ }
  const missing = tickers.filter(t => got[t] === undefined);
  if (missing.length) {
    const results = await Promise.allSettled(missing.map(t =>
      fetchJson('https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(t) + '?interval=1d&range=1d').then(d => ({ t, p: d && d.chart && d.chart.result && d.chart.result[0] && d.chart.result[0].meta && d.chart.result[0].meta.regularMarketPrice }))
    ));
    results.forEach(r => { if (r.status === 'fulfilled' && r.value && isFinite(r.value.p)) got[r.value.t] = r.value.p; });
  }
  const gotCount = Object.keys(got).length;
  if (gotCount) {
    Object.keys(got).forEach(t => { S.settings.prices[t] = got[t]; });
    S.settings.priceUpdatedAt = Date.now();
    live.priceStatus = gotCount === tickers.length ? 'live' : 'partial';
    persist(); checkPriceAlerts();
  } else {
    live.priceStatus = navigator.onLine ? 'error' : 'offline'; // ไม่ลบราคาที่มีอยู่เดิม ใช้ค่าล่าสุดที่เคยดึงได้ต่อไป

}
async function refreshRateNow() {

    if (!navigator.onLine) throw new Error('offline');

  }

}

    <p class="muted" style="margin:14px 0 0;font-size:13px">เริ่มจากศูนย์: ใส่มูลค่าพอร์ตตั้งต้น (เงินสด + ต้นทุนหุ้นที่ถืออยู่เดิม) ในตั้งค่า แล้วบันทึกเงินฝากหลังจากนั้นในแท็บฝาก/ถอน</p>
  </section>`;
}

function holdHTML(h) {
  if (h.zero) {
    return `<div class="hold sold"><div class="hold-top"><span class="tk">${esc(h.t)}</span><span class="grow">ขายหมดแล้ว · กำไรที่ขายแล้ว</span><span class="${sgn(h.realized)}">${money(h.realized, '$', { sign: true })}</span></div></div>`;
  }
  const avgDec = Math.abs(h.avg) < 10 ? 4 : 2;
  const al = S.settings.alerts[h.t] || {};
  return `<div class="hold">
    <div class="hold-top"><span class="tk">${esc(h.t)}</span><span class="grow">${fmtShares(h.shares)} หุ้น · ต้นทุนเฉลี่ย ${money(h.avg, '$', { dec: avgDec })}</span><span class="mv">${h.mv === null ? '–' : money(h.mv)}</span></div>
    <div class="hold-mid">
      <label class="pricein">ราคาตอนนี้ $<input inputmode="decimal" data-price="${esc(h.t)}" value="${h.price === null ? '' : h.price}" placeholder="0.00" aria-label="ราคาปัจจุบันของ ${esc(h.t)}"></label>
      <span class="${sgn(h.unreal)}">${h.unreal === null ? 'ยังไม่ใส่ราคา' : money(h.unreal, '$', { sign: true }) + (h.unrealPct !== null ? ' (' + pct(h.unrealPct, true) + ')' : '')}</span>
    </div>
    <div class="hold-bot">ขายไปแล้ว <span class="${sgn(h.realized)}">${money(h.realized, '$', { sign: true })}</span>${h.total !== null ? ` · รวม <span class="${sgn(h.total)}">${money(h.total, '$', { sign: true })}</span>` : ''}${h.status === 'SHARES DIFF' ? ` <span class="tag bad">ไม่ตรงโบรกเกอร์ ต่าง ${fmtShares(h.diff)}</span>` : ''}</div>
    <div class="hold-alert">
      <label>🎯 Target $<input inputmode="decimal" data-alert-target="${esc(h.t)}" value="${al.target == null ? '' : al.target}" placeholder="ไม่ตั้ง" aria-label="ราคาเป้าหมายของ ${esc(h.t)}"></label>
      <label>🛑 Stop $<input inputmode="decimal" data-alert-stop="${esc(h.t)}" value="${al.stop == null ? '' : al.stop}" placeholder="ไม่ตั้ง" aria-label="Stop loss ของ ${esc(h.t)}"></label>
    </div>
  </div>`;
}

function checksHTML() {
  const open = ui.checksOpen === null ? C.issues > 0 : ui.checksOpen;
  const b = st => `<span class="badge ${st.replace(' ', '')}">${st === 'NO INPUT' ? 'ยังไม่ใส่' : st === 'OK' ? 'ปกติ' : st === 'CHECK' ? 'ตรวจ' : 'ข้อมูล'}</span>`;
  return `<details class="panel" id="checks" ${open ? 'open' : ''}>
    <summary><span class="sum-l">ตรวจความถูกต้อง</span><span class="pill ${C.issues ? 'bad' : 'ok'}">${C.issues ? C.issues + ' จุดต้องดู' : 'ปกติ'}</span></summary>
    ${C.checks.map(c => `<div class="check">${b(c.status)}<div><div class="t">${esc(c.label)}</div><div class="d">${esc(c.detail)}</div></div></div>`).join('')}
  </details>`;
}

function viewSummary() {
  const uname = (S.settings.username || '').trim();
  const greet = `<div class="greet">${uname ? `สวัสดีคุณ "${esc(uname)}" 👋` : 'สวัสดี 👋'}</div>`;
  if (isEmpty()) return greet + onboardHTML();
  const s = C.sum, rate = num(S.settings.usdThb);
  const nop = C.holdings.filter(h => h.status === 'NO PRICE').map(h => h.t);
  let h = '<div class="stack">';
  h += greet;
  if (heldTickers().length) h += `<section class="panel panel-pad live-panel">${liveRow('price', live.priceStatus, S.settings.priceUpdatedAt)}${liveRow('rate', live.rateStatus, S.settings.rateUpdatedAt)}</section>`;
  h += `<section class="hero">
    <div class="hero-label">มูลค่าพอร์ตตอนนี้ (USD)</div>
    <div class="hero-num">${money(s.value)}</div>
    <div class="hero-sub">${rate ? '≈ ' + money(s.value * rate, '฿', { dec: 0 }) + ' · ' : ''}<span class="${sgn(s.ret)}">ผลตอบแทน ${money(s.ret, '$', { sign: true })}${s.retPct !== null ? ' (' + pct(s.retPct, true) + ')' : ''}</span></div>
    ${nop.length ? `<div class="notice warn">ยังไม่ได้ใส่ราคาปัจจุบันของ ${esc(nop.join(', '))} — มูลค่าพอร์ตยังไม่ครบ</div>` : ''}
    ${Math.abs(s.walkDiff) > s.tol && !nop.length ? `<div class="notice bad">สมการไม่ลงตัว ผลต่าง ${money(s.walkDiff)} — ดูหัวข้อ “ตรวจความถูกต้อง”</div>` : ''}
    <div class="ledger">
      <div class="ledger-cap"><span>ที่มาของมูลค่าพอร์ต</span><span>USD</span></div>
      ${lrow('เงินตั้งต้น', s.start)}
      ${lrow('เงินฝากเข้า', s.dep, { signed: true })}
      ${lrow('เงินถอนออก', -s.wd, { signed: true })}
      ${lrow('กำไรที่ขายแล้ว', s.realized, { signed: true, color: true })}
      ${lrow('กำไรที่ยังไม่ขาย', s.unreal, { signed: true, color: true })}
      ${s.transferFees ? lrow('ค่าโอนเข้า/ออก', -s.transferFees, { signed: true }) : ''}
      ${lrow('มูลค่าพอร์ต', s.value, { cls: 'total' })}
      <div class="ledger-foot">เงินสด ${money(s.curCash)} + หุ้น ${money(s.mvTotal)}</div>
    </div>
  </section>`;
  const eq = equityCurve(S, C);
  if (eq.length >= 2) {
    const capSeries = { name: 'เงินทุนสะสม (ฝาก − ถอน)', color: 'var(--accent)', points: eq.map(p => ({ x: shortDate(p.date), y: p.capital })) };
    const realSeries = { name: 'กำไรสะสมที่ขายแล้ว', color: 'var(--gain)', points: eq.map(p => ({ x: shortDate(p.date), y: p.realized })) };
    h += `<section class="panel panel-pad"><h2 style="font-size:15px;margin-bottom:2px">การเติบโตของพอร์ต</h2><p class="muted" style="font-size:12.5px;margin:0 0 10px">เงินทุนสะสมเทียบกับกำไรที่ขายแล้วสะสม ตามเวลา</p>${lineChart([capSeries, realSeries], { aria: 'กราฟการเติบโตของพอร์ต' })}<div class="chart-legend">${lineLegend([capSeries, realSeries], v => money(v, '$', { sign: true }))}</div></section>`;
  }
  const palette = ['var(--accent)', 'var(--sell)', 'var(--warn)', 'var(--gain)', 'var(--loss)'];
  const segs = [];
  if (s.curCash > 0.5) segs.push({ label: 'เงินสด', value: s.curCash, color: 'var(--ink3)' });
  C.holdings.filter(x => !x.zero && x.mv !== null && x.mv > 0).sort((a, b) => b.mv - a.mv).forEach((x, i) => segs.push({ label: x.t, value: x.mv, color: palette[i % palette.length] }));
  if (segs.length) {
    h += `<section class="panel panel-pad"><h2 style="font-size:15px;margin-bottom:10px">สัดส่วนพอร์ต</h2>${donutChart(segs, { aria: 'สัดส่วนพอร์ตตามมูลค่า' })}</section>`;
  }
  if (C.holdings.length) {
    const act = C.holdings.filter(x => !x.zero), sold = C.holdings.filter(x => x.zero);
    h += `<section class="panel"><div class="sec-head"><h2>หุ้นที่ถืออยู่</h2><small>ใส่ราคาตอนนี้ของแต่ละตัว</small></div>
      ${act.map(holdHTML).join('')}
      ${act.length ? `<div class="hold-total"><span>รวมมูลค่าหุ้น</span><span>${money(s.mvTotal)}</span></div>` : ''}
      ${sold.map(holdHTML).join('')}
    </section>`;
  }
  h += `<section class="panel"><div class="sec-head"><h2>ตัวเลขสรุป</h2><small>USD</small></div><dl class="kv">
    <div class="r"><dt>เงินสดคงเหลือ</dt><dd>${money(s.curCash)}</dd></div>
    <div class="r"><dt>ต้นทุนหุ้นที่ยังถืออยู่</dt><dd>${money(s.costHold)}</dd></div>
    <div class="r"><dt>เงินทุน (ตั้งต้น + ฝาก)</dt><dd>${money(s.capital)}</dd></div>
    <div class="r"><dt>ผลตอบแทนรวม</dt><dd class="${sgn(s.ret)}">${money(s.ret, '$', { sign: true })} · ${pct(s.retPct, true)}</dd></div>
    <div class="r"><dt>ที่ขายแล้ว (Realized)</dt><dd class="${sgn(s.realized)}">${money(s.realized, '$', { sign: true })} · ${pct(s.realPct, true)}</dd></div>
    <div class="r"><dt>ที่ยังไม่ขาย (Unrealized)</dt><dd class="${sgn(s.unreal)}">${money(s.unreal, '$', { sign: true })} · ${pct(s.unrealPct, true)}</dd></div>
    <div class="r"><dt>ซื้อหุ้นรวม / ขายหุ้นรวม</dt><dd>${money(s.buys)} / ${money(s.sells)}</dd></div>
    <div class="r"><dt>ค่าธรรมเนียมซื้อขาย (รวมในตัวเลขข้างบนแล้ว)</dt><dd>${money(s.tradeFees)}</dd></div>
  </dl></section>`;
  h += checksHTML();
  return h + '</div>';
}

function stockRowHTML(r) {
  const d = r.date || '';
  if (r.status === 'Incomplete') {
    return `<button class="trow" data-act="edit-stock" data-id="${r.id}"><span class="tdate"><b>${d ? Number(d.slice(8)) : '?'}</b><span>${d ? MONTHS[Number(d.slice(5, 7)) - 1] : ''}</span></span><span class="tmain"><span class="tline1"><b>${esc(r.asset || '?')}</b><span class="tag bad">ข้อมูลไม่ครบ</span></span><span class="tline2">แตะเพื่อแก้ไข</span></span></button>`;
  }
  const buy = r.action === 'BUY', sym = r.cur === 'THB' ? '฿' : '$';
  return `<button class="trow" data-act="edit-stock" data-id="${r.id}">
    <span class="tdate"><b>${Number(d.slice(8))}</b><span>${MONTHS[Number(d.slice(5, 7)) - 1]}</span></span>
    <span class="tmain"><span class="tline1"><b>${esc(r.asset)}</b><span class="tag ${buy ? 'buy' : 'sell'}">${buy ? 'ซื้อ' : 'ขาย'}</span>${r.status === 'SELL > held' ? '<span class="tag bad">ขายเกินที่ถือ</span>' : ''}</span>
    <span class="tline2">${fmtShares(r.shares)} × ${sym}${priceFmt(r.price)}${r.fee ? ' · ค่าธรรมเนียม ' + money(r.fee, sym) : ''}</span></span>
    <span class="tamt"><b>${money(buy ? -r.net : r.net, sym, { sign: !buy })}</b>${!buy && r.pl !== null ? `<span class="${sgn(r.pl)}">กำไร ${money(r.pl, sym, { sign: true })}</span>` : `<span>หุ้นเหลือ ${fmtShares(r.sharesAfter)}</span>`}</span>
  </button>`;
}

function groupedList(rows, rowFn) {
  let out = '', cur = null;
  rows.forEach(r => {
    const k = (r.date || '').slice(0, 7);
    if (k !== cur) { cur = k; out += `<div class="month">${monthLabel(k)}</div>`; }
    out += rowFn(r);
  });
  return out;
}

function viewStocks() {
  const tick = Object.keys(C.st.per).sort();
  if (ui.stockFilter !== 'ALL' && !tick.includes(ui.stockFilter)) ui.stockFilter = 'ALL';
  let rows = C.st.rows.slice().reverse();
  if (ui.stockFilter !== 'ALL') rows = rows.filter(r => r.asset === ui.stockFilter);
  const chips = tick.length > 1 ? `<div class="chips" role="group" aria-label="กรองตามหุ้น">
    ${['ALL'].concat(tick).map(t => `<button class="chip" data-act="filter" data-v="${esc(t)}" aria-pressed="${ui.stockFilter === t}">${t === 'ALL' ? 'ทั้งหมด' : esc(t)}</button>`).join('')}</div>` : '';
  const fees = rows.reduce((a, r) => a + (r.fee || 0), 0);
  const pl = rows.reduce((a, r) => a + (r.pl || 0), 0);
  return `<div class="stack">${tick.length ? `<section class="panel panel-pad live-panel">${liveRow('price', live.priceStatus, S.settings.priceUpdatedAt)}</section>` : ''}${chips}
    <section class="panel">
      ${rows.length ? `<div class="sec-head"><h2>${rows.length} รายการ</h2><small>ค่าธรรมเนียม ${money(fees)} · กำไรที่ขายแล้ว <span class="${sgn(pl)}">${money(pl, '$', { sign: true })}</span></small></div>` : ''}
      ${rows.length ? groupedList(rows, stockRowHTML) : `<div class="empty"><b>ยังไม่มีรายการหุ้น</b>กดปุ่มด้านล่างเพื่อบันทึกการซื้อหรือขายหุ้น</div>`}
    </section></div>`;
}

function fxRowHTML(r) {
  const d = r.date || '';
  if (r.status === 'Incomplete') {
    return `<button class="trow" data-act="edit-fx" data-id="${r.id}"><span class="tdate"><b>${d ? Number(d.slice(8)) : '?'}</b><span>${d ? MONTHS[Number(d.slice(5, 7)) - 1] : ''}</span></span><span class="tmain"><span class="tline1"><b>แลกเงิน</b><span class="tag bad">ข้อมูลไม่ครบ</span></span><span class="tline2">แตะเพื่อแก้ไข</span></span></button>`;
  }
  const buy = r.action === 'BUY USD';
  return `<button class="trow" data-act="edit-fx" data-id="${r.id}">
    <span class="tdate"><b>${Number(d.slice(8))}</b><span>${MONTHS[Number(d.slice(5, 7)) - 1]}</span></span>
    <span class="tmain"><span class="tline1"><b>${buy ? money(r.thb, '฿') + ' → ' + money(r.usd) : money(r.usd) + ' → ' + money(r.thb, '฿')}</b><span class="tag ${buy ? 'buy' : 'sell'}">${buy ? 'ซื้อ USD' : 'ขาย USD'}</span></span>
    <span class="tline2">เรท ${money(r.rate, '฿', { dec: 2 })}${r.fee ? ' · ค่าธรรมเนียม ' + money(r.fee, '฿') : ''}${r.note ? ' · ' + esc(r.note) : ''}</span></span>
    <span class="tamt"><b>${money(r.usdBal)}</b>${r.realized !== null ? `<span class="${sgn(r.realized)}">${money(r.realized, '฿', { sign: true })}</span>` : '<span>USD คงเหลือ</span>'}</span>
  </button>`;
}

function viewFx() {
  const f = C.fx, rate = f.rateNow;
  const rows = f.rows.slice().reverse();
  const msAsc = monthlyStats(C);
  const ms = msAsc.slice().reverse();
  const nomo = !ms.length;
  const rateRows = f.rows.filter(r => r.status === 'OK' && r.rate != null);
  let rateChart = '';
  if (rateRows.length >= 2) {
    rateChart = `<section class="panel panel-pad"><h2 style="font-size:15px;margin-bottom:2px">เรทการแลกเงินตามเวลา</h2><p class="muted" style="font-size:12.5px;margin:0 0 10px">฿ ต่อ 1 USD แต่ละรายการ · <span style="color:var(--buy)">●</span> ซื้อ USD &nbsp;<span style="color:var(--sell)">●</span> ขาย USD</p>${fxRateChart(rateRows, { aria: 'เรทการแลกเงินตามเวลา' })}</section>`;
  }
  let volChart = '';
  if (msAsc.length >= 2) {
    const recent = msAsc.slice(-8);
    const multiYear = recent[0].k.slice(0, 4) !== recent[recent.length - 1].k.slice(0, 4);
    const cats = recent.map(m => ({ k: m.k, label: monthShort(m.k, multiYear) }));
    const series = [{ name: 'ซื้อ USD', color: 'var(--buy)', values: recent.map(m => m.buyUsd) }, { name: 'ขาย USD', color: 'var(--sell)', values: recent.map(m => m.sellUsd) }];
    const scope = msAsc.length > recent.length ? `${recent.length} เดือนล่าสุด` : 'ทุกเดือนที่มีรายการ';
    volChart = `<section class="panel panel-pad"><h2 style="font-size:15px;margin-bottom:2px">ซื้อ/ขาย USD รายเดือน</h2><p class="muted" style="font-size:12.5px;margin:0 0 10px">รวม ${esc(scope)}</p>${barChart(cats, series, { aria: 'ปริมาณซื้อขาย USD รายเดือน' })}<div class="chart-legend">${barLegend(series, v => money(v, ''))}</div></section>`;
  }
  return `<div class="stack">
  <section class="panel panel-pad live-panel">${liveRow('rate', live.rateStatus, S.settings.rateUpdatedAt)}</section>
  ${rateChart}${volChart}
  <section class="panel">
    <div class="grid4">
      <div><div class="k">USD คงเหลือ</div><div class="v">${money(f.usdNow)}</div></div>
      <div><div class="k">ต้นทุนเฉลี่ย</div><div class="v">${money(f.avgCost, '฿', { dec: 4 })}</div><div class="s muted">ต่อ 1 USD</div></div>
      <div><div class="k">มูลค่าตอนนี้</div><div class="v">${f.valueNow === null ? '–' : money(f.valueNow, '฿', { dec: 0 })}</div><div class="s muted">ต้นทุน ${money(f.totalCost, '฿', { dec: 0 })}</div></div>
      <div><div class="k">กำไร/ขาดทุนที่ยังไม่ขาย</div><div class="v ${sgn(f.unreal)}">${f.unreal === null ? '–' : money(f.unreal, '฿', { sign: true })}</div><div class="s ${sgn(f.unreal)}">${f.unrealPct === null ? '' : pct(f.unrealPct, true)}</div></div>
    </div>
    <div class="rate-row"><label for="rateFx">เรทตลาดตอนนี้ (บาทต่อ 1 USD)</label><input id="rateFx" inputmode="decimal" data-set="usdThb" value="${rate === null ? '' : rate}" placeholder="เช่น 33.32"></div>
    <dl class="kv">
      <div class="r"><dt>กำไร/ขาดทุนที่ขายแล้ว (Realized)</dt><dd class="${sgn(f.realized)}">${money(f.realized, '฿', { sign: true })}</dd></div>
      <div class="r"><dt>รวม Realized + Unrealized</dt><dd class="${sgn(f.total)}">${f.total === null ? '–' : money(f.total, '฿', { sign: true })}</dd></div>
      <div class="r"><dt>บาทที่ใช้ซื้อ USD ทั้งหมด</dt><dd>${money(f.thbBought, '฿')}</dd></div>
      <div class="r"><dt>บาทที่ได้จากการขาย USD</dt><dd>${money(f.thbSold, '฿')}</dd></div>
      <div class="r"><dt>ค่าธรรมเนียมรวม</dt><dd>${money(f.fees, '฿')}</dd></div>
    </dl>
    ${rate === null ? '<div style="padding:0 16px 14px"><div class="notice info" style="margin:0">ใส่เรทตลาดเพื่อดูมูลค่าและกำไรขาดทุนของ USD ที่ถืออยู่</div></div>' : ''}
  </section>
  ${nomo ? '' : `<details class="panel" id="monthly" ${ui.monthOpen ? 'open' : ''}><summary><span class="sum-l">สรุปรายเดือน</span></summary>
    <div class="tscroll"><table class="mt"><thead><tr><th>เดือน</th><th>ครั้ง</th><th>ซื้อ USD</th><th>ขาย USD</th><th>เรทซื้อเฉลี่ย</th><th>เรทขายเฉลี่ย</th><th>ค่าธรรมเนียม ฿</th><th>กำไรขายหุ้น $</th></tr></thead><tbody>
    ${ms.map(m => `<tr><td>${monthLabel(m.k)}</td><td>${m.n}</td><td>${m.buyUsd ? money(m.buyUsd, '') : '–'}</td><td>${m.sellUsd ? money(m.sellUsd, '') : '–'}</td><td>${m.avgBuy === null ? '–' : money(m.avgBuy, '')}</td><td>${m.avgSell === null ? '–' : money(m.avgSell, '')}</td><td>${m.fee ? money(m.fee, '') : '–'}</td><td class="${sgn(m.plStock)}">${m.sells ? money(m.plStock, '', { sign: true }) : '–'}</td></tr>`).join('')}
    </tbody></table></div></details>`}
  <section class="panel">
    ${rows.length ? `<div class="sec-head"><h2>${rows.length} รายการ</h2><small>ซื้อ ${money(f.usdBought)} · ขาย ${money(f.usdSold)}</small></div>${groupedList(rows, fxRowHTML)}` : `<div class="empty"><b>ยังไม่มีรายการแลกเงิน</b>บันทึกเมื่อแลกบาทเป็น USD หรือ USD กลับเป็นบาท</div>`}
  </section></div>`;
}

function cashRowHTML(r) {
  const d = r.date || '';
  if (r.status === 'Incomplete') {

/* ---------- sheet / dialog ---------- */
function openSheet(html) {
  const w = $('#sheetWrap');
  $('#sheet').innerHTML = html;
  w.classList.add('open'); document.body.classList.add('noscroll');
  $('#sheet').scrollTop = 0; $('#sheet').focus();
}
function closeSheet() {
  $('#sheetWrap').classList.remove('open'); document.body.classList.remove('noscroll'); $('#sheet').innerHTML = '';
}
function confirmBox(msg, okLabel, danger) {
  return new Promise(res => {
    const w = $('#dlgWrap');
    w.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="actions"><button class="btn" data-dlg="no">ยกเลิก</button><button class="btn ${danger ? 'danger' : 'primary'}" data-dlg="yes">${esc(okLabel || 'ตกลง')}</button></div></div>`;
    w.classList.add('open');
    const done = v => { w.classList.remove('open'); w.innerHTML = ''; w.onclick = null; res(v); };
    w.onclick = e => { const b = e.target.closest('[data-dlg]'); if (b) done(b.dataset.dlg === 'yes'); else if (e.target === w) done(false); };
    const first = w.querySelector('[data-dlg="no"]'); if (first) first.focus();
  });
}
function head(title) { return `<div class="sheet-head"><h3>${title}</h3><button type="button" class="icon-btn" data-act="close" aria-label="ปิด">${ICON.x}</button></div>`; }
function fld(label, name, val, o) {
  o = o || {};
  return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${o.type || 'text'}" ${o.im ? `inputmode="${o.im}"` : ''} value="${esc(val === null || val === undefined ? '' : val)}" ${o.ph ? `placeholder="${o.ph}"` : ''} ${o.list ? `list="${o.list}"` : ''} autocomplete="off" ${o.cap ? 'autocapitalize="characters"' : ''}>${o.hint ? `<small>${o.hint}</small>` : ''}</div>`;
}
function seg(name, opts, cur, label) {
  return `<div class="seg" role="radiogroup" aria-label="${label}" style="margin-top:8px">${opts.map(o => `<label><input type="radio" name="${name}" value="${o[0]}" ${cur === o[0] ? 'checked' : ''}><span>${o[1]}</span></label>`).join('')}</div>`;
}
function lastBroker() {
  const rows = S.stocks.slice().sort((a, b) => (b.seq || 0) - (a.seq || 0));
  const r = rows.find(x => x.broker);
  return r ? r.broker : (S.settings.defaultBroker || '');
}
