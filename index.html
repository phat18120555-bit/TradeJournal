function readStock(f) {
  const g = n => (f.elements[n] ? f.elements[n].value : '');
  const fee = num(g('fee'));
  return {
    date: g('date'), asset: g('asset').trim().toUpperCase(), action: f.elements['action'].value === 'SELL' ? 'SELL' : 'BUY',
    shares: num(g('shares')), price: num(g('price')), fee: fee === null ? 0 : fee, currency: g('currency') || 'USD', fxRate: num(g('fxRate')),
    time: g('time'), broker: g('broker').trim(), txId: g('txId').trim(), source: g('source').trim(), note: g('note').trim()
  };
}
function prow(a, b, cls) { return `<div class="r"><span>${a}</span><span class="${cls || ''}">${b}</span></div>`; }
function stockCandidate(f, v) {
  v = v || readStock(f);
  const id = f.dataset.id || '__new__';
  const old = f.dataset.id ? S.stocks.find(x => x.id === id) : null;
  const tmp = Object.assign({}, S, { stocks: S.stocks.filter(x => x.id !== id).concat([Object.assign({}, v, { id, seq: old ? old.seq : S.seq })]) });
  return computeStocks(tmp, computeCash(tmp)).rows.find(x => x.id === id);
}
function updatePreview() {
  const f = $('#frm'); const box = $('#preview'); if (!f || !box) return;
  if (f.dataset.kind === 'stock') {
    const v = readStock(f), sym = v.currency === 'THB' ? '฿' : '$';
    if (!(v.shares > 0 && v.price > 0)) { box.innerHTML = prow('ยอดรวม / สุทธิ', 'กรอกจำนวนและราคา'); return; }
    const row = stockCandidate(f, v);
    if (!row || row.status === 'Incomplete') { box.innerHTML = prow('ยอดรวม / สุทธิ', 'กรอกข้อมูลให้ครบ'); return; }
    let h = prow('ยอดรวมก่อนค่าธรรมเนียม', money(row.gross, sym)) + prow(v.action === 'BUY' ? 'ยอดสุทธิ (รวมค่าธรรมเนียม)' : 'ยอดสุทธิ (หักค่าธรรมเนียม)', '<b>' + money(row.net, sym) + '</b>');
    if (v.action === 'SELL') h += prow('ต้นทุนหุ้นที่ขาย (เฉลี่ย)', money(row.cost, sym)) + prow('กำไร/ขาดทุนที่ขายแล้ว', '<b>' + money(row.pl, sym, { sign: true }) + '</b>', sgn(row.pl));
    h += prow('หุ้นเหลือหลังรายการนี้', fmtShares(row.sharesAfter)) + prow('เงินสดหลังรายการนี้', money(row.cashAfter, sym), row.cashAfter < -0.005 ? 'loss' : '');
    if (row.status === 'SELL > held') h += '<div class="notice bad">ขายเกินจำนวนที่ถืออยู่ ณ วันที่นี้ — ตรวจจำนวนหุ้นหรือวันที่</div>';

    const cf = computeFX(tmp), row = cf.rows.find(x => x.id === id);

    let h = prow('เรทที่แลก', '<b>' + money(row.rate, '฿') + ' ต่อ 1 USD</b>') + prow('USD คงเหลือหลังรายการนี้', money(row.usdBal), row.usdBal < -0.005 ? 'loss' : '') + prow('ต้นทุนเฉลี่ย USD', money(row.avgCost, '฿', { dec: 4 }));
    if (row.realized !== null) h += prow('กำไร/ขาดทุนจากการขาย USD', '<b>' + money(row.realized, '฿', { sign: true }) + '</b>', sgn(row.realized));
    if (row.usdBal < -0.005) h += '<div class="notice warn">USD คงเหลือติดลบ — ขาด USD ตั้งต้นหรือรายการซื้อหรือเปล่า?</div>';
    box.innerHTML = h;
  } else if (f.dataset.kind === 'cash') {

  }
}

/* ---------- import / export / backup ---------- */
async function handleXlsx(file) {
  if (typeof XLSX === 'undefined') { toast('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองใหม่เมื่อมีอินเทอร์เน็ต'); playSound('error'); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const sheets = {};
    wb.SheetNames.forEach(n => { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }); });
    const imp = importSheets(sheets);
    if (!imp.stocks.length && !imp.fx.length && !imp.cash.length) { toast('ไม่พบรายการในไฟล์นี้ (ต้องมีชีต Stock Transactions, FX Transactions หรือ Cash Flow)'); playSound('error'); return; }
    const msg = `พบ หุ้น ${imp.stocks.length} · แลกเงิน ${imp.fx.length} · ฝาก/ถอน ${imp.cash.length} รายการ\n` + (hasData(S) ? 'การนำเข้าจะแทนที่ข้อมูลปัจจุบันทั้งหมด' : 'นำเข้าเข้าสมุดนี้เลยไหม?');
    if (!(await confirmBox(msg, 'นำเข้า', false))) return;
    S = imp; ui.stockFilter = 'ALL'; persist(); go('sum'); toast('นำเข้าแล้ว ' + (imp.stocks.length + imp.fx.length + imp.cash.length) + ' รายการ'); playSound('success');
  } catch (e) { toast('อ่านไฟล์ไม่สำเร็จ ตรวจว่าเป็นไฟล์ .xlsx'); playSound('error'); }
}
async function saveFile(filename, data) {
  const dl = await cap('downloads');
  if (!dl) return false;
  try { await dl.save({ filename, data }); return true; } catch (e) { if (e && e.code === 'declined') return true; throw e; }
}
async function exportXlsx() {
  if (typeof XLSX === 'undefined') { toast('ส่งออก Excel ไม่ได้ (โหลดไลบรารีไม่สำเร็จ)'); return; }
  const ser = d => { if (!d) return ''; const p = d.split('-').map(Number); return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(1899, 11, 30)) / 86400000); };
  const wb = XLSX.utils.book_new();
  const add = (name, aoa) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    for (let r = 1; r < aoa.length; r++) { const ref = XLSX.utils.encode_cell({ r, c: 0 }); if (ws[ref] && ws[ref].t === 'n') ws[ref].z = 'yyyy-mm-dd'; }
    ws['!cols'] = aoa[0].map(() => ({ wch: 15 })); XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const v = x => (x === null || x === undefined ? '' : x);
  add('Stock Transactions', [['Date', 'Time', 'Asset', 'Action', 'Shares', 'Price per Share', 'Currency', 'Gross Amount', 'Fee', 'Net Amount', 'FX Rate', 'THB Value', 'Cost Basis', 'Realized P/L', 'Shares After', 'Cash Balance After', 'Transaction ID', 'Broker', 'Note', 'Source', 'Row Check']]
    .concat(C.st.rows.map(r => [ser(r.date), r.time || '', r.asset, r.action, v(r.shares), v(r.price), r.cur, v(r.gross), r.fee, v(r.net), v(num(r.fxRate)), v(r.thb), v(r.cost), v(r.pl), v(r.sharesAfter), v(r.cashAfter), r.txId || '', r.broker || '', r.note || '', r.source || '', r.status === 'Incomplete' ? 'Incomplete' : r.status])));
  add('FX Transactions', [['Date', 'Action', 'THB Used/Received', 'USD Received/Used', 'FX Rate', 'Fee', 'Net USD', 'Note', 'Source', 'USD Balance', 'THB Balance', 'ต้นทุนเฉลี่ยสะสม', 'FX Realized P/L']]
    .concat(C.fx.rows.map(r => [ser(r.date), r.action, v(r.thb), v(r.usd), v(r.rate), r.fee, v(r.netUsd), r.note || '', r.source || '', v(r.usdBal), v(r.thbBal), v(r.avgCost), v(r.realized)])));
  add('Cash Flow', [['Date', 'Type', 'Amount', 'Currency', 'Direction', 'Fee', 'Net Amount', 'Source', 'Note', 'Account Impact (USD)', 'Linked FX Id']]
    .concat(C.cash.rows.map(r => [ser(r.date), r.type || '', v(r.amount), r.cur, r.type === 'Deposit' ? 'IN' : r.type === 'Withdrawal' ? 'OUT' : '', r.fee, r.amount === null ? '' : (r.type === 'Deposit' ? r.amount - r.fee : r.amount + r.fee), r.source || '', r.note || '', v(r.impact), r.mirrorFxId || ''])));
  const st = S.settings, kv = [['key', 'value'], ['startValue', st.startValue], ['tolerance', st.tolerance], ['usdThb', v(st.usdThb)], ['brokerCash', v(st.brokerCash)], ['brokerValue', v(st.brokerValue)], ['fxStartUsd', st.fxStartUsd], ['fxStartThb', st.fxStartThb], ['fxStartCost', v(st.fxStartCost)], ['username', st.username || '']];
  Object.keys(st.prices).forEach(k => kv.push(['price:' + k, st.prices[k]]));
  Object.keys(st.brokerShares).forEach(k => kv.push(['brokerShares:' + k, st.brokerShares[k]]));
  add('Settings', kv);
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  try { const ok = await saveFile('trade-journal-' + today() + '.xlsx', buf); if (!ok) { toast('เครื่องนี้ยังบันทึกไฟล์จากหน้านี้ไม่ได้ ใช้ “สำรอง / กู้คืน” แทน'); playSound('warn'); } else { toast('ส่งออกแล้ว'); playSound('success'); } } catch (e) { toast('ส่งออกไม่สำเร็จ'); playSound('error'); }
}

  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'tab') go(t.dataset.tab);
  else if (a === 'close') closeSheet();
  else if (a === 'add') { if (ui.tab === 'stock') openStock(); else if (ui.tab === 'fx') openFx(); else if (ui.tab === 'cash') openCash(); }
  else if (a === 'add-stock-first') { ui.tab = 'stock'; render(); openStock(); }
  else if (a === 'edit-stock') openStock(id);
  else if (a === 'edit-fx') openFx(id);
  else if (a === 'edit-cash') openCash(id);
  else if (a === 'del') deleteCurrent();
  else if (a === 'filter') { ui.stockFilter = t.dataset.v; render(); }
  else if (a === 'checks') go('sum', { checks: true });
  else if (a === 'pick-xlsx') $('#fileXlsx').click();
  else if (a === 'pick-json') $('#fileJson').click();
  else if (a === 'export-xlsx') exportXlsx();
  else if (a === 'backup') openBackup();
  else if (a === 'bk-file') { try { const ok = await saveFile('trade-journal-backup-' + today() + '.json', backupJson); toast(ok ? 'บันทึกไฟล์แล้ว' : 'เครื่องนี้บันทึกไฟล์ไม่ได้ ใช้ “คัดลอกข้อความ” แทน'); playSound(ok ? 'success' : 'warn'); } catch (er) { toast('บันทึกไฟล์ไม่สำเร็จ'); playSound('error'); } }
  else if (a === 'bk-copy') { const ok = await copyText(backupJson); toast(ok ? 'คัดลอกแล้ว วางเก็บไว้ในที่ปลอดภัย' : 'คัดลอกไม่สำเร็จ'); playSound(ok ? 'success' : 'error'); }
  else if (a === 'bk-restore') { const v = $('#restoreBox').value.trim(); if (!v) toast('วางข้อความที่สำรองไว้ก่อน'); else restoreFrom(v); }
  else if (a === 'sound-test') playSound('success');
  else if (a === 'refresh-prices') refreshPricesNow();
  else if (a === 'refresh-rate') refreshRateNow();
  else if (a === 'notif-request') requestNotifPermission();
  else if (a === 'save-username') { const inp = $('#unameInput'); if (inp) { S.settings.username = inp.value.trim().slice(0, 50); persist(); render(); toast('บันทึกชื่อแล้ว'); playSound('success'); } }
  else if (a === 'wipe') { if (await confirmBox('ล้างข้อมูลทั้งหมดในสมุดนี้? แนะนำให้สำรองข้อมูลก่อน', 'ล้างทั้งหมด', true)) { S = newState(); persist(); go('sum'); toast('ล้างข้อมูลแล้ว'); } }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.price !== undefined) {
    const p = num(t.value); if (p === null) delete S.settings.prices[t.dataset.price]; else S.settings.prices[t.dataset.price] = p;
    persist(); checkPriceAlerts(); render();
  } else if (t.dataset && t.dataset.bshare !== undefined) {
    const p = num(t.value); if (p === null) delete S.settings.brokerShares[t.dataset.bshare]; else S.settings.brokerShares[t.dataset.bshare] = p;
    persist(); render();
  } else if (t.dataset && t.dataset.set) {
    const k = t.dataset.set, p = num(t.value);
    if (k === 'startValue' || k === 'fxStartUsd' || k === 'fxStartThb') S.settings[k] = p === null ? 0 : p;
    else if (k === 'tolerance') S.settings[k] = p === null || p < 0 ? 0.01 : p;
    else S.settings[k] = p;
    persist(); render();
  } else if (t.id === 'fileXlsx') { const f = t.files && t.files[0]; t.value = ''; if (f) handleXlsx(f); }
  else if (t.id === 'fileJson') { const f = t.files && t.files[0]; t.value = ''; if (f) { try { $('#restoreBox').value = await f.text(); toast('อ่านไฟล์แล้ว กด “กู้คืน” เพื่อยืนยัน'); } catch (er) { toast('อ่านไฟล์ไม่สำเร็จ'); } } }
  else if (t.name === 'soundEnabled') { S.settings.soundEnabled = t.value === 'on'; persist(); render(); if (S.settings.soundEnabled) playSound('success'); }
  else if (t.dataset && t.dataset.soundvol !== undefined) { S.settings.soundVolume = Math.max(0, Math.min(100, Number(t.value))) / 100; persist(); }
  else if (t.name === 'autoPrice') { S.settings.autoPrice = t.value === 'on'; persist(); render(); if (S.settings.autoPrice) refreshPricesNow(); }
  else if (t.name === 'autoRate') { S.settings.autoRate = t.value === 'on'; persist(); render(); if (S.settings.autoRate) refreshRateNow(); }
  else if (t.name === 'notifEnabled') { S.settings.notifEnabled = t.value === 'on'; persist(); render(); }
  else if (t.dataset && t.dataset.alertTarget !== undefined) {
    const tk = t.dataset.alertTarget, p = num(t.value);
    S.settings.alerts[tk] = Object.assign({ target: null, stop: null }, S.settings.alerts[tk]);
    S.settings.alerts[tk].target = p; if (S.settings.alertsFired[tk]) S.settings.alertsFired[tk].target = false;
    persist();
  } else if (t.dataset && t.dataset.alertStop !== undefined) {
    const tk = t.dataset.alertStop, p = num(t.value);
    S.settings.alerts[tk] = Object.assign({ target: null, stop: null }, S.settings.alerts[tk]);
    S.settings.alerts[tk].stop = p; if (S.settings.alertsFired[tk]) S.settings.alertsFired[tk].stop = false;
    persist();
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.soundvol !== undefined) {
    const lbl = e.target.previousElementSibling;
    if (lbl) lbl.textContent = 'ระดับเสียง ' + e.target.value + '%';
    return;
  }
  const f = e.target.form; if (!f || f.id !== 'frm') return;
  if (e.target.name === 'action') fxLabels();
  updatePreview();
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; if (f.id !== 'frm') return;
  if (f.dataset.kind === 'stock') saveStock(f); else if (f.dataset.kind === 'fx') saveFx(f); else if (f.dataset.kind === 'cash') saveCash(f);
});
document.addEventListener('toggle', e => {
  if (e.target.id === 'checks') ui.checksOpen = e.target.open;
  if (e.target.id === 'monthly') ui.monthOpen = e.target.open;
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#dlgWrap').classList.contains('open')) $('#dlgWrap').click(); else if ($('#sheetWrap').classList.contains('open')) closeSheet(); }
});
$('#sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap') closeSheet(); });

/* ---------- ป้องกันการคัดลอกข้อความในแอป (ให้รู้สึกเหมือนแอป ไม่ใช่เว็บไซต์) ---------- */
// อนุญาตเฉพาะใน input / textarea / select ที่ผู้ใช้ต้องกรอกหรือแก้ไขข้อมูลเอง — ปุ่ม/Export/Backup ใช้ clipboard API แบบโปรแกรม ไม่ผ่านทางนี้ จึงไม่กระทบ
function isEditable(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }
document.addEventListener('contextmenu', e => { if (!isEditable(e.target)) e.preventDefault(); });
document.addEventListener('copy', e => { if (!isEditable(e.target)) e.preventDefault(); });
document.addEventListener('selectstart', e => { if (!isEditable(e.target)) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (!isEditable(e.target)) e.preventDefault(); });

/* ---------- App Shortcuts (manifest.json) → route ด้วย hash ---------- */
let pendingShortcutAdd = null;
(function routeFromShortcut() {
  const h = (location.hash || '').replace('#', '');
  const known = { sum: 'sum', stock: 'stock', fx: 'fx', cash: 'cash', set: 'set', 'stock-add': 'stock' };
  if (known[h]) { ui.tab = known[h]; if (h === 'stock-add') pendingShortcutAdd = 'stock'; }
  if (h) history.replaceState(null, '', location.pathname + location.search);
})();

buildTabbar();
render();
if (pendingShortcutAdd === 'stock') openStock();
initRemote();
startLiveTimers();
window.addEventListener('online', () => { if (S.settings.autoPrice) refreshPricesNow(); if (S.settings.autoRate) refreshRateNow(); });

/* ---------- offline indicator (ไม่แตะ state/ข้อมูลใดๆ) ---------- */
function updateOfflineBar() {
  const bar = $('#offlineBar');
  if (bar) bar.hidden = navigator.onLine;
}
window.addEventListener('online', updateOfflineBar);
window.addEventListener('offline', updateOfflineBar);
updateOfflineBar();

/* ---------- ติดตั้ง service worker เพื่อให้เปิดออฟไลน์ได้ (เสริมเฉยๆ ไม่กระทบข้อมูล) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => { /* เปิดจากไฟล์ในเครื่อง หรือเบราว์เซอร์ไม่รองรับ ใช้งานแอปต่อได้ตามปกติ */ });
  });
}

</script>
</body>
</html>
